# Lint and format rules enforced in CI (`ruff check .` and `ruff format --check .`).
target-version = "py311"
line-length = 100

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
]
ignore = [
    "SIM115",  # long-lived handles (lock file, followed log) can't use `with`
]
