# Lint rules enforced in CI. Kept deliberately small for now: stricter rules
# and `ruff format --check` follow in the formatting clean-up (see #12).
target-version = "py311"
line-length = 100

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # import sorting
]
