# Copy to ~/.config/oolite-helper/config.toml and adjust.
# Every setting is optional; command-line options override this file.

[window]
# Which monitor, by xrandr name. Run `oolite-helper --list-screens` to see them.
# Default: the first monitor that isn't primary (else the primary).
# screen = "HDMI-1"

# Size, in pixels or as a percentage of that monitor.
width = "100%"
height = "100%"

# Where on the monitor: top-left, top, top-right, left, center, right,
# bottom-left, bottom, bottom-right.
anchor = "top-left"

# Gap from the monitor's edges, in pixels.
margin = 0

# "large" (big text, up to 3 key columns) or "compact" (60% text and spacing,
# up to 6 columns, so more panels fit).
layout = "large"

# Text size multiplier on top of the layout. The number of key columns follows
# the window width.
font_scale = 1.0

# Exact X geometry (WxH+X+Y). If set, it overrides all of the above.
# geometry = "1200x1000+2640+40"

# Example: a strip down the right-hand third of a 34" ultrawide.
#   screen = "DP-1"
#   width = "33%"
#   anchor = "right"
#   font_scale = 0.9
