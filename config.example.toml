# Copy to ~/.config/oolite-helper/config.toml and adjust.
# Every setting is optional; command-line options override this file.

[window]
# Which monitor, by xrandr name. Run `oolite-helper --list-screens` to see them.
# Default: the first monitor that isn't primary (else the primary).
# screen = "HDMI-1"

# Size, in pixels or as a percentage of that monitor.
width = "100%"
height = "100%"

# Where on the monitor: top-left, top, top-right, left, center, right,
# bottom-left, bottom, bottom-right.
anchor = "top-left"

# Gap from the monitor's edges, in pixels.
margin = 0

# "large" (big text, up to 3 key columns) or "compact" (60% text and spacing,
# up to 6 columns, so more panels fit).
layout = "large"

# Text size multiplier on top of the layout. The number of key columns follows
# the window width.
font_scale = 1.0

# Keys for equipment your ship hasn't got (or that's damaged), e.g. ECM or
# fuel injectors: "grey" shows them dimmed, "hide" leaves them out.
missing_equipment = "grey"

# Widgets (below) are web views. "tk" uses the older Tk widgets instead, which
# the helper also falls back to if the web views can't start.
ui = "web"

# Exact X geometry (WxH+X+Y). If set, it overrides all of the above.
# geometry = "1200x1000+2640+40"

# Example: a strip down the right-hand third of a 34" ultrawide.
#   screen = "DP-1"
#   width = "33%"
#   anchor = "right"
#   font_scale = 0.9

# Widgets: small windows hosting one or more components, docked to the game window or
# placed on a monitor. Optional; with none, the helper looks as before.
# Docked widgets sit just outside the game window, follow it when it moves,
# and show only while the game is the active window. A component with nothing
# to show says why (e.g. "Away from stations").
#
# components: one or more components: "heading", "tip", "status",
#             "keys", "all_keys", "trade_table", "trade_here", "drive" (TORUS/
#             JUMP), "clearance", "radar", "hold" (see helper/web/components/); or the name of
#             one plugin from ~/.config/oolite-helper/plugins/, alone (plugins
#             are web pages in their own window; see #59)
# dock:       "game:top", "game:bottom", "game:left" or "game:right"
# screen/x/y: for a free widget instead of dock (x/y are an offset when docked)
# width/height, layout ("compact", the default when docked to the game, or
# "large", the default otherwise), font_scale,
# show ("with_game" default when docked: only while the game is the active
# window; or "always"), hide_empty (false default: always shown, each component
# saying why it's empty; true hides it while a plugin calls oolite.show(false))
# id:         optional stable name for the widget (default "widget<n>:<component>").
#             Moves, resizes and closes made in the helper are saved by id in
#             layout.toml beside this file; delete it to go back to these.
# widget:     a widget by name, from helper/web/widgets/, instead of listing
#             everything: "top-strip" (clearance and drive above the game),
#             "trade-beside" (trade_here to its right), "radar-beside" (every
#             scanner blip, left of the game while flying), "hold-beside" (everything
#             aboard, right of the game) or "tabs" (a tab row over
#             one of "keys", "all_keys" and "trade_table" at a time; the choice
#             is shared, and an emergency shows Keys). Any setting above
#             changes that widget's. Its id is the widget's name.
#
# [[widgets]]
# widget = "top-strip"
#
# [[widgets]]
# widget = "trade-beside"
# width = 520
#
# [[widgets]]
# components = ["clearance"]
# dock = "game:bottom"
#
# [[widgets]]
# widget = "tabs"
# components = ["keys", "trade_table"]
# screen = "eDP-1"
# width = 1920
# height = 1080

# Docks (#80): widgets stacked on one side of the game window, all the same
# width, with no positions to work out. Down the side for game:left and
# game:right (give the dock a width, and each widget a height); left to right
# for game:top and game:bottom (give the dock a height, and each widget a
# width). A widget without one is as big as its components need. Each entry
# takes the [[widgets]] settings except dock, screen, x and y. A closed widget
# leaves no gap. gap: px between widgets (default 0). One dock per side.
#
# [[docks]]
# dock = "game:right"
# width = 640
# widgets = [
#   { widget = "trade-beside", height = 400 },
#   { widget = "hold-beside", height = 310 },
# ]
