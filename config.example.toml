# Copy to ~/.config/oolite-helper/config.toml and adjust.
# Every setting is optional; command-line options override this file.

[window]
# Which monitor, by xrandr name. Run `oolite-helper --list-screens` to see them.
# Default: the first monitor that isn't primary (else the primary).
# screen = "HDMI-1"

# Size, in pixels or as a percentage of that monitor.
width = "100%"
height = "100%"

# Where on the monitor: top-left, top, top-right, left, center, right,
# bottom-left, bottom, bottom-right.
anchor = "top-left"

# Gap from the monitor's edges, in pixels.
margin = 0

# "large" (big text, up to 3 key columns) or "compact" (60% text and spacing,
# up to 6 columns, so more panels fit).
layout = "large"

# Text size multiplier on top of the layout. The number of key columns follows
# the window width.
font_scale = 1.0

# Keys for equipment your ship hasn't got (or that's damaged), e.g. ECM or
# fuel injectors: "grey" shows them dimmed, "hide" leaves them out.
missing_equipment = "grey"

# Exact X geometry (WxH+X+Y). If set, it overrides all of the above.
# geometry = "1200x1000+2640+40"

# Example: a strip down the right-hand third of a 34" ultrawide.
#   screen = "DP-1"
#   width = "33%"
#   anchor = "right"
#   font_scale = 0.9

# Widgets: views in their own small windows, docked to the game window or
# placed on a monitor. Optional; with none, the helper looks as before.
# Docked widgets sit just outside the game window, follow it when it moves,
# and show only while the game is the active window. A widget with nothing to
# show (e.g. the drive chips while docked) hides itself.
#
# views:      one or more of "drive" (TORUS/JUMP), "clearance", "trade_here";
#             or the name of one plugin from ~/.config/oolite-helper/plugins/,
#             alone (plugins are web pages in their own window; see #59)
# dock:       "game:top", "game:bottom", "game:left" or "game:right"
# screen/x/y: for a free widget instead of dock (x/y are an offset when docked)
# width/height, layout ("compact" default, or "large"), font_scale,
# show ("with_game" default when docked, or "always")
#
# [[widgets]]
# views = ["clearance", "drive"]
# dock = "game:top"
#
# [[widgets]]
# views = ["trade_here"]
# dock = "game:right"
# width = 560
