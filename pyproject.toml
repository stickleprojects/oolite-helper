[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oolite-helper"
version = "0.1.0"
description = "Context-aware keyboard shortcut helper for Oolite"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kieron Wray" }]
requires-python = ">=3.11"
# Tkinter comes from the system Python (python3-tk), not pip.
dependencies = []
urls = { Repository = "https://github.com/stickleprojects/oolite-helper" }

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "mypy>=2.4.0"]

[project.scripts]
oolite-helper = "helper.app:main"

[tool.setuptools]
packages = ["helper"]
