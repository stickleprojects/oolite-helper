[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oolite-helper"
version = "0.1.0"
description = "Context-aware keyboard shortcut helper for Oolite"
requires-python = ">=3.11"
# Tkinter comes from the system Python (python3-tk), not pip.
dependencies = []

[project.scripts]
oolite-helper = "helper.app:main"

[tool.setuptools]
packages = ["helper"]
