[build-system]
requires = ["setuptools>=77"]  # 77: license as an SPDX string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "oolite-helper"
version = "0.1.0"
description = "Context-aware keyboard shortcut helper for Oolite"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kieron Wray" }]
requires-python = ">=3.11"
# Tkinter comes from the system Python (python3-tk), not pip.
dependencies = ["pydantic>=2.11,<3"]
urls = { Repository = "https://github.com/stickleprojects/oolite-helper" }

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "mypy>=2.4.0", "shellcheck-py>=0.10.0.1"]

[project.scripts]
oolite-helper = "helper.app:main"

[tool.setuptools.packages.find]
include = ["helper*"]  # helper.components and helper.webhost too

[tool.setuptools.package-data]
helper = ["web/lib/*", "web/components/*/*", "web/widgets/*/*"]  # components (#82), widgets (#84)
