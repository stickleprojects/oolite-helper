# Checks every pull request and every push to main. These jobs are required
# status checks on main, so a red PR can't be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # pytest is listed explicitly until the dev extra (from #10) is on main.
        run: python -m pip install -e ".[dev]" pytest
      - name: Tkinter available
        run: python -c "import tkinter, helper.app"
      - name: pytest
        run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy helper/plist.py helper/config.py helper/screen.py helper/sources.py

  oxp:
    name: Add-on (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check oxp/CtxKeys.oxp/Config/script.js
          for f in helper/web/lib/*.js helper/web/components/*/*.js; do node --check "$f"; done
      - name: Fake-Oolite harness tests
        # Name the file: a bare folder argument fails on Node 22+.
        run: node --test tests/oxp/script.test.js
      - name: Web component tests
        run: node --test helper/web/lib/*.test.js helper/web/components/*/*.test.js

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
