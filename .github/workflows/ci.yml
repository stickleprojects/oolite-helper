# Checks every pull request and every push to main. These jobs are required
# status checks on main, so a red PR can't be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Component READMEs workflow after it commits to a PR branch:
  # its own push can't start CI, and the required checks must run on that commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # pytest is listed explicitly until the dev extra (from #10) is on main.
        run: python -m pip install -e ".[dev]" pytest
      # The checks themselves are in scripts/run-ci-checks.sh, which runs them locally too.
      # The tools are in setup-python's install, so it's the "venv".
      - run: VENV="$pythonLocation" scripts/run-ci-checks.sh --only python

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" ruff==0.17.1
      - run: VENV="$pythonLocation" scripts/run-ci-checks.sh --only lint

  oxp:
    name: Add-on (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Syntax check, fake-Oolite harness tests and web component tests.
      - run: scripts/run-ci-checks.sh --only js

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" # shellcheck-py, the same version as locally
      - run: VENV="$pythonLocation" scripts/run-ci-checks.sh --only shell
