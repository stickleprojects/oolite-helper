# Prepares the environment GitHub Copilot's coding agent works in, so it can
# run the helper's code and tests. The job must be named copilot-setup-steps.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Tk for the helper window, xvfb for headless smoke tests, shellcheck for scripts/.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb shellcheck

      - name: Python venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" pytest ruff==0.17.1
          .venv/bin/python -c "import tkinter, helper.app; print('tk', tkinter.TkVersion)"

      - name: Add-on syntax check
        run: node --check oxp/CtxKeys.oxp/Config/script.js
